# OAI LTE eNB 2 (the FALSE BASE STATION), N300 -> EPC 2 (epc2, 192.168.1.4).
# LTE twin of etc/oai/gnb2_n300_core2.conf. It CLONES the home cell: same band
# 40 carrier (2350 MHz) and same PLMN (999/99) as enb1, but keeps its own PCI
# (Nid_cell 3) and PRACH root, and broadcasts a DIFFERENT TAC (2) on its own
# EPC 2, which holds the same subscribers. An idle UE that reselects to the FBS
# finds a new TAC and performs a Tracking Area Update / attach on EPC 2.
# Differs from enb1_x310_epc1.conf only in: eNB_ID, Nid_cell, prach_root, TAC,
# mme_ip (EPC 2), the node network addresses, and the RU (N300) section.

Active_eNBs = ( "enb2_n300_epc2" );
Asn1_verbosity = "none";

eNBs =
(
 {
    eNB_ID    =  0xe01;
    cell_type =  "CELL_MACRO_ENB";
    eNB_name  =  "enb2_n300_epc2";

    // FBS tracking area: DIFFERENT from the home cell (TAC 1) so the lured UE
    // performs a TAU/attach on EPC 2. Must match the MME tac on epc2.
    tracking_area_code  =  2;
    // Same PLMN as the home network (the clone).
    plmn_list = ( { mcc = 999; mnc = 99; mnc_length = 2; } );

    tr_s_preference     = "local_mac"

    component_carriers = (
      {
      node_function             = "3GPP_eNODEB";
      node_timing               = "synch_to_ext_device";
      node_synch_ref            = 0;
      frame_type					      = "FDD";
      tdd_config 					      = 3;
      tdd_config_s            			      = 0;
      prefix_type             			      = "NORMAL";
      eutra_band              			      = 1;
      // SAME carrier as the home cell (cloned).
      downlink_frequency      			      = 2140000000L;
      uplink_frequency_offset 			      = -190000000;
      // Own physical cell identity (home uses 1).
      Nid_cell					      = 3;
      N_RB_DL                 			      = 50;
      Nid_cell_mbsfn          			      = 0;
      nb_antenna_ports                                = 1;
      nb_antennas_tx          			      = 1;
      nb_antennas_rx          			      = 1;
      tx_gain                                            = 90;
      rx_gain                                            = 100;
      // Own PRACH root sequence (home uses 0) so the two cells' PRACH differ.
      prach_root              			      = 16;
      prach_config_index      			      = 0;
      prach_high_speed        			      = "DISABLE";
      prach_zero_correlation  			      = 1;
      prach_freq_offset       			      = 2;
      pucch_delta_shift       			      = 1;
      pucch_nRB_CQI           			      = 0;
      pucch_nCS_AN            			      = 0;
      pucch_n1_AN             			      = 0;
      pdsch_referenceSignalPower 			      = -27;
      pdsch_p_b                  			      = 0;
      pusch_n_SB                 			      = 1;
      pusch_enable64QAM          			      = "DISABLE";
      pusch_hoppingMode                                  = "interSubFrame";
      pusch_hoppingOffset                                = 0;
      pusch_groupHoppingEnabled  			      = "ENABLE";
      pusch_groupAssignment      			      = 0;
      pusch_sequenceHoppingEnabled		   	      = "DISABLE";
      pusch_nDMRS1                                       = 1;
      phich_duration                                     = "NORMAL";
      phich_resource                                     = "ONESIXTH";
      srs_enable                                         = "DISABLE";

      pusch_p0_Nominal                                   = -96;
      pusch_alpha                                        = "AL1";
      pucch_p0_Nominal                                   = -104;
      msg3_delta_Preamble                                = 6;
      pucch_deltaF_Format1                               = "deltaF2";
      pucch_deltaF_Format1b                              = "deltaF3";
      pucch_deltaF_Format2                               = "deltaF0";
      pucch_deltaF_Format2a                              = "deltaF0";
      pucch_deltaF_Format2b		    	      = "deltaF0";

      rach_numberOfRA_Preambles                          = 64;
      rach_preamblesGroupAConfig                         = "DISABLE";
      rach_powerRampingStep                              = 4;
      rach_preambleInitialReceivedTargetPower            = -108;
      rach_preambleTransMax                              = 10;
      rach_raResponseWindowSize                          = 10;
      rach_macContentionResolutionTimer                  = 48;
      rach_maxHARQ_Msg3Tx                                = 4;

      pcch_default_PagingCycle                           = 128;
      pcch_nB                                            = "oneT";
      bcch_modificationPeriodCoeff			      = 2;
      ue_TimersAndConstants_t300			      = 1000;
      ue_TimersAndConstants_t301			      = 1000;
      ue_TimersAndConstants_t310			      = 1000;
      ue_TimersAndConstants_t311			      = 10000;
      ue_TimersAndConstants_n310			      = 20;
      ue_TimersAndConstants_n311			      = 1;
      ue_TransmissionMode                                    = 1;
      }
    );

    srb1_parameters :
    {
        timer_poll_retransmit    = 80;
        timer_reordering         = 35;
        timer_status_prohibit    = 0;
        poll_pdu                 =  4;
        poll_byte                =  99999;
        max_retx_threshold       =  4;
    }

    SCTP :
    {
        SCTP_INSTREAMS  = 2;
        SCTP_OUTSTREAMS = 2;
    };

    ////////// MME parameters: EPC 2 (the FBS core) on cn node 192.168.1.4.
    mme_ip_address = ({ ipv4 = "192.168.1.4"; });

    enable_x2 = "no";
    t_reloc_prep      = 1000;
    tx2_reloc_overall = 2000;
    t_dc_prep         = 1000;
    t_dc_overall      = 2000;

    NETWORK_INTERFACES :
    {
        // This node's LAN address (enb2 = 192.168.1.3), matching the profile.
        ENB_IPV4_ADDRESS_FOR_S1_MME              = "192.168.1.3/24";
        ENB_IPV4_ADDRESS_FOR_S1U                 = "192.168.1.3/24";
        ENB_PORT_FOR_S1U                         = 2152;
        ENB_IPV4_ADDRESS_FOR_X2C                 = "192.168.1.3/24";
        ENB_PORT_FOR_X2C                         = 36422;
    };
  }
);

MACRLCs = (
	{
	num_cc = 1;
	tr_s_preference = "local_L1";
	tr_n_preference = "local_RRC";
	phy_test_mode = 0;
        puSch10xSnr     =  200;
        puCch10xSnr     =  200;
        }
);

L1s = (
    	{
	num_cc = 1;
	tr_n_preference = "local_mac";
        }
);

RUs = (
    {
       local_rf       = "yes"
       nb_tx          = 1
       nb_rx          = 1
       att_tx         = 0
       att_rx         = 0;
       bands          = [1];
       max_pdschReferenceSignalPower = -27;
       max_rxgain                    = 75;
       eNB_instances  = [0];
       sdr_addrs      = "mgmt_addr=192.168.10.2,addr=192.168.10.2";
       clock_src      = "internal";
       time_src       = "internal";
    }
);

THREAD_STRUCT = (
  {
    parallel_config    = "PARALLEL_SINGLE_THREAD";
    worker_config      = "WORKER_ENABLE";
  }
);

log_config :
{
  global_log_level                      ="info";
  hw_log_level                          ="info";
  phy_log_level                         ="info";
  mac_log_level                         ="info";
  rlc_log_level                         ="info";
  pdcp_log_level                        ="info";
  rrc_log_level                         ="info";
};
