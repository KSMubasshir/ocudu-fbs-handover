# Model A (unknown-cell) neighbour/measurement config, @include'd by
# gnb1_x310_core1.conf.
#
# Goal: the UE treats gNB 2 as a handover candidate and would ask to be handed
# over to it, but gNB 1 holds NO neighbour relation for gNB 2's cell, so it
# cannot resolve the reported PCI to a target and the handover fails at the
# source (TS 38.300: a gNB hands over only to cells in its neighbour relation
# table; OAI has no reportCGI fallback, so an unknown PCI is simply refused).
#
# To make the UE measure gNB 2's carrier at all, OAI needs at least one
# neighbour cell on that frequency (the measurement object is built per
# neighbour). We give it a LEGITIMATE same-operator neighbour that happens to
# share the carrier -- the realistic reason an operator would have the UE
# measure 3319.68 MHz -- at a PCI that is not on air in this lab. gNB 2's real
# cell (PCI 3, PLMN 001/01 on core 2) is deliberately absent from this table,
# so when the UE reports PCI 3 there is "no such neighbour in configuration".

neighbour_list = (
  {
    # gNB 1's own serving cell id (key into this list).
    nr_cellid = 105217;
    neighbour_cell_configuration = (
      {
        # A legitimate same-PLMN neighbour on gNB 2's carrier. Its only role
        # here is to put 621312 into the UE's measurement config. It is not on
        # air in this lab (PCI 500), so the UE never reports it; it is NOT
        # gNB 2.
        gNB_ID               = 413;
        nr_cellid            = 105729;    # 413 * 256 + 1
        plmn                 = { mcc = 999; mnc = 99; mnc_length = 2 };
        tracking_area_code   = 1;
        physical_cellId      = 500;
        absoluteFrequencySSB = 621312;    # gNB 2's carrier (3319.68 MHz)
        subcarrierSpacing    = 1;         # 30 kHz
        band                 = 78;
      }
    );
  }
);

nr_measurement_configuration = {
  Periodical = {
    enable                    = 1;
    includeBeamMeasurements   = 1;
    maxNrofRS_IndexesToReport = 4;
  };

  A2 = {
    enable          = 1;
    threshold       = 60;
    time_to_trigger = 1;
  };

  # Any cell (physCellId -1) better than serving triggers a report, so the UE
  # reports gNB 2's PCI 3 on 621312 even though only the PCI-500 sister cell is
  # configured as a relation.
  A3 = (
    {
      physCellId      = -1;
      offset          = 0;
      hysteresis      = 0;
      time_to_trigger = 1;
    }
  )
};
