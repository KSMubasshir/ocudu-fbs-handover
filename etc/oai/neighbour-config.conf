# Neighbour list and measurement configuration shared by both gNBs
# (@include'd from gnb1_x310_n2_ho.conf and gnb2_n300_n2_ho.conf).
# Layout follows OAI's doc/handover-tutorial.md: outer entries are keyed by the
# serving cell's nr_cellid, so each gNB only uses its own entry.
# Both cells are on the same carrier, so no inter-frequency (frequency_list)
# entry is needed.

neighbour_list = (
  # Used by gNB 1 (gNB_ID 411, nr_cellid 105217, PCI 1)
  {
    nr_cellid = 105217;
    neighbour_cell_configuration = (
      {
        gNB_ID               = 412;
        nr_cellid            = 105473;
        physical_cellId      = 3;
        absoluteFrequencySSB = 641280;
        subcarrierSpacing    = 1; # 30 kHz
        band                 = 78;
        plmn                 = { mcc = 999; mnc = 99; mnc_length = 2 };
        tracking_area_code   = 1;
      }
    );
  },

  # Used by gNB 2 (gNB_ID 412, nr_cellid 105473, PCI 3)
  {
    nr_cellid = 105473;
    neighbour_cell_configuration = (
      {
        gNB_ID               = 411;
        nr_cellid            = 105217;
        physical_cellId      = 1;
        absoluteFrequencySSB = 641280;
        subcarrierSpacing    = 1; # 30 kHz
        band                 = 78;
        plmn                 = { mcc = 999; mnc = 99; mnc_length = 2 };
        tracking_area_code   = 1;
      }
    );
  }
);

nr_measurement_configuration = {
  Periodical = {
    enable                    = 1;
    includeBeamMeasurements   = 1;
    maxNrofRS_IndexesToReport = 4;
  };

  A2 = {
    enable          = 1;
    threshold       = 60;
    time_to_trigger = 1;
  };

  # offset is in 0.5 dB steps: 6 = neighbour 3 dB better than serving.
  # time_to_trigger 1 = 40 ms.
  A3 = (
    {
      physCellId      = -1; # any cell
      offset          = 6;
      hysteresis      = 0;
      time_to_trigger = 1;
    }
  )
};
