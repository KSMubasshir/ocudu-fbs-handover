# Phantom neighbour for the failed-handover scenario, @include'd by
# gnb1_x310_core1.conf. It gives gNB 1 just enough to make the UE MEASURE and
# REPORT gNB 2's cell as a handover candidate -- the radio pointer that OAI
# puts over the air in a MeasObjectNR: SSB frequency, SCS, band and PCI.
#
# Everything that would identify gNB 2 as a real node or link to core 2 is
# deliberately WRONG: the target PLMN is gNB 1's own 999/99 (not gNB 2's
# 001/01) and the gNB ID / cell id are values core 1 does not serve. So gNB 1
# and core 1 hold no true information about gNB 2 or core 2. When the UE asks
# to be handed over, gNB 1 sends NGAP HandoverRequired to core 1 for this
# phantom target, core 1 cannot resolve it, and the handover fails; the UE
# stays on gNB 1.

neighbour_list = (
  {
    # gNB 1's own serving cell id (key into this list).
    nr_cellid = 105217;
    neighbour_cell_configuration = (
      {
        # --- Phantom identity: NOT gNB 2 (which is gNB 412, cell 105473,
        #     PLMN 001/01 on core 2). Core 1 serves no such cell. ---
        gNB_ID               = 420;
        nr_cellid            = 107521;    # 420 * 256 + 1
        plmn                 = { mcc = 999; mnc = 99; mnc_length = 2 };
        tracking_area_code   = 1;
        # --- Radio pointer: the real carrier and PCI of gNB 2's cell, so the
        #     UE measures there and reports PCI 3 as an A3 candidate. ---
        physical_cellId      = 3;
        absoluteFrequencySSB = 621312;    # gNB 2's own carrier (3319.68 MHz)
        subcarrierSpacing    = 1;         # 30 kHz
        band                 = 78;
      }
    );
  }
);

nr_measurement_configuration = {
  Periodical = {
    enable                    = 1;
    includeBeamMeasurements   = 1;
    maxNrofRS_IndexesToReport = 4;
  };

  A2 = {
    enable          = 1;
    threshold       = 60;
    time_to_trigger = 1;
  };

  # Any cell (physCellId -1) that is better than serving triggers a report.
  # offset/hysteresis 0 so the ~1-2 dB that gNB 2 leads by is enough.
  A3 = (
    {
      physCellId      = -1;
      offset          = 0;
      hysteresis      = 0;
      time_to_trigger = 1;
    }
  )
};
